# SUPERSEDED. Use docs/ranking/factor-campaign-manifest/ (campaign C2).
#
# WHAT HAPPENED, recorded rather than deleted. Four factor batches were dispatched
# simultaneously on 2026-07-30 and two of them independently reached the same
# conclusion — that Benjamini-Hochberg must be applied at the campaign denominator
# and not the batch's own m — and each built a manifest for it without seeing the
# other. Batch 5 opened `docs/ranking/factor-campaign-manifest/` (campaign C2);
# batch 6 opened this file. Two manifests is the failure both were built to stop,
# so this one is retired and C2 is the single source of truth.
#
# C2's design is better on the point that matters under concurrency: ONE FILE PER
# BATCH, never a shared file, so four agents on one checkout cannot clobber each
# other's registration. This file could not have survived four concurrent writers.
#
# THE CORRECTION THIS COST, stated plainly. Batch 6 registered m = 23 here before
# fitting and graded at a campaign denominator of 47 (its own 23 plus batch 3's
# 24). C2's rule is M_campaign = max(sum of registered m_b, FLOOR = 80), and C2
# explicitly does not retroactively re-grade batches 1-3. The correct denominator
# was therefore 80, not 47.
#
# Batch 6 was re-graded at 80 WITHOUT RERUNNING ANYTHING, because its
# pre-commitment required every surviving arm to report a BREAKING M -- the
# largest denominator at which it would still clear BH q=0.10. Exactly one arm
# changed grade and it moved conservatively: X3 (xFP luck residual) at RB, breaking
# m = 56, BOARD-NEUTRAL at 47 -> MARGINAL at 80. Every other graded arm has a
# breaking m of 140-1721 and is unaffected.
#
# All published batch-6 grades are at M = 80. Registration and the full arm list:
# docs/ranking/factor-campaign-manifest/batch-6.md

id: F-FACTOR-CAMPAIGN-2026-07-30
status: superseded
superseded_by: docs/ranking/factor-campaign-manifest/README.md
superseded_on: 2026-07-30
superseded_reason: >-
  Duplicate of campaign C2, which was opened first by batch 5 and uses a
  one-file-per-batch layout that is safe under concurrent writers. Retained as the
  record of batch 6's original m=23 registration and of the denominator correction
  from 47 to 80 that followed.

batches:
  - batch: 6
    owner: ranker
    m: 23
    registered: 2026-07-30
    registered_before_fitting: true
    graded_at_campaign_m: 80
    precommit: docs/ranking/factor-batch-6-precommit.md
    results: docs/ranking/factor-batch-6-results.md
    now_registered_in: docs/ranking/factor-campaign-manifest/batch-6.md

name: Daily ADP snapshot

# WHY THIS RUNS OFF-MACHINE.
# data/adp-snapshots/YYYY-MM-DD.csv is the canonical archive of MFL ADP, and MFL
# serves a ROLLING aggregate -- totalDrafts was observed falling from 50 on
# 2026-07-26 to 43 on 2026-07-29 -- so a day not captured is gone permanently
# with no backfill path (docs/can-we-rebuild-the-database.md). Capture previously
# depended on a Windows Scheduled Task reported by schtasks as
# "Logon Mode: Interactive only", which does not fire from a locked or
# logged-out machine, and no unattended fire had ever been verified.
#
# This workflow does NOT write data/nfl.db. CI has no copy and it is gitignored
# at 813 MB. Only the CSV -- the irreplaceable part -- is produced here; the DB
# can be backfilled from the committed CSVs locally whenever convenient.
#
# SOURCE CONSTRAINTS. Exactly one request to one documented, unrestricted
# endpoint (api.myfantasyleague.com .../export?TYPE=adp), sending the project's
# descriptive User-Agent from src/ingest_mfl_adp.py and backing off on HTTP 429.
# One request per run satisfies the one-request-per-second rule by construction.
# No scraping, no restricted endpoints -- FFC and the FantasyPros ADP pages stay
# untouched, per docs/research/source-audit-2026-07.md.

on:
  schedule:
    # 09:15 UTC daily. Deliberately not on the hour: GitHub's scheduler queues
    # heavily at :00 and can drop or delay runs under load.
    - cron: "15 9 * * *"
  workflow_dispatch:        # manual runs, used to verify this workflow

permissions:
  contents: write           # needed only to commit the captured CSV

concurrency:
  # Never let two captures race for the same UTC day's file.
  group: adp-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # nflreadpy is needed only for the ff_playerids identity crosswalk.
        run: python -m pip install --quiet --upgrade pip nflreadpy polars

      - name: Pull ff_playerids crosswalk into a throwaway database
        # The CSV's player_name/position/team columns come from an mfl_id join
        # against ff_playerids. Without this step the capture would still
        # "succeed" and produce a CSV of nulls in those columns -- structurally
        # valid, quietly degraded. The capture step below refuses to run if this
        # table is missing or short.
        #
        # The database path is under data/ on purpose: ingest_mfl_adp derives the
        # CSV directory from the DB's parent, so this lands the file in
        # data/adp-snapshots/, and data/*.db is already gitignored so the
        # throwaway DB can never be committed.
        run: python src/ingest_reference.py --db data/ci-adp.db --only ff_playerids

      - name: Capture ADP snapshot
        # Exits non-zero on: no database, short ff_playerids, fetch failure,
        # zero players, totalDrafts<=0, no CSV written, CSV under 100 rows, or
        # under 90% name resolution. A silent empty capture is worse than a
        # missed day, so every one of those fails the run instead of committing.
        run: python tools/ci_adp_snapshot.py --db data/ci-adp.db

      - name: Verify a CSV for today actually exists
        # Belt and braces: assert the artifact on disk before allowing a commit,
        # independent of the capture step's own reporting.
        run: |
          DATE=$(date -u +%F)
          FILE="data/adp-snapshots/${DATE}.csv"
          if [ ! -s "$FILE" ]; then
            echo "::error::${FILE} is missing or empty after a reportedly successful capture"
            exit 1
          fi
          ROWS=$(( $(wc -l < "$FILE") - 1 ))
          if [ "$ROWS" -lt 100 ]; then
            echo "::error::${FILE} has only ${ROWS} data rows"
            exit 1
          fi
          echo "verified ${FILE} with ${ROWS} data rows"
          echo "SNAPSHOT_FILE=${FILE}" >> "$GITHUB_ENV"
          echo "SNAPSHOT_ROWS=${ROWS}" >> "$GITHUB_ENV"

      - name: Commit and push the snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SNAPSHOT_FILE}"
          if git diff --cached --quiet; then
            echo "no change for ${SNAPSHOT_FILE} -- already captured today, nothing to commit"
            exit 0
          fi
          git commit -m "data: ADP snapshot ${SNAPSHOT_FILE##*/} (${SNAPSHOT_ROWS} rows, automated)"
          # Rebase before pushing: a local session may have pushed while this ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily ADP snapshot"
            echo ""
            echo "- Date (UTC): $(date -u +%F)"
            echo "- File: ${SNAPSHOT_FILE:-none written}"
            echo "- Rows: ${SNAPSHOT_ROWS:-0}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
